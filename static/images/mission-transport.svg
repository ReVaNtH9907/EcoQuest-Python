<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="bikeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGradTrans)" />
  <!-- Ground path -->
  <path d="M 30 240 Q 200 230 370 240" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- Wheels -->
  <!-- Left Wheel -->
  <circle cx="120" cy="190" r="45" fill="none" stroke="#334155" stroke-width="6" />
  <circle cx="120" cy="190" r="6" fill="#059669" />
  <!-- Right Wheel -->
  <circle cx="280" cy="190" r="45" fill="none" stroke="#334155" stroke-width="6" />
  <circle cx="280" cy="190" r="6" fill="#059669" />
  <!-- Spokes -->
  <line x1="120" y1="145" x2="120" y2="235" stroke="#94A3B8" stroke-width="2" />
  <line x1="75" y1="190" x2="165" y2="190" stroke="#94A3B8" stroke-width="2" />
  <line x1="280" y1="145" x2="280" y2="235" stroke="#94A3B8" stroke-width="2" />
  <line x1="235" y1="190" x2="325" y2="190" stroke="#94A3B8" stroke-width="2" />
  <!-- Frame -->
  <polygon points="120,190 190,190 250,130 170,130" fill="none" stroke="url(#bikeGrad)" stroke-width="7" stroke-linejoin="round" />
  <line x1="120" y1="190" x2="170" y2="130" stroke="url(#bikeGrad)" stroke-width="7" stroke-linecap="round" />
  <line x1="190" y1="190" x2="160" y2="105" stroke="url(#bikeGrad)" stroke-width="7" stroke-linecap="round" />
  <line x1="280" y1="190" x2="250" y2="105" stroke="url(#bikeGrad)" stroke-width="7" stroke-linecap="round" />
  <!-- Saddle -->
  <path d="M 145 105 L 180 105 C 175 110 160 115 145 105 Z" fill="#1E293B" />
  <!-- Handlebars -->
  <path d="M 240 105 L 260 105 Q 268 105 265 118" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
  <!-- Eco leaf emblem floating above -->
  <path d="M 200 60 C 220 50 235 65 230 85 C 215 90 200 75 200 60 Z" fill="#059669" />
  <path d="M 200 60 L 225 80" stroke="#FFFFFF" stroke-width="2" />
</svg>
