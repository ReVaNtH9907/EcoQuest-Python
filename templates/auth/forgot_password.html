{% extends "base.html" %}

{% block title %}Reset Password · EcoQuest{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        
        <div class="auth-header">
            <div class="auth-header-icon">🔐</div>
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Enter your registered email and we'll send you a recovery code.</p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST" class="auth-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">Registered Email Address</label>
                <input type="email" id="email" name="email" class="form-input"
                       placeholder="you@domain.com" required autofocus>
            </div>

            <div class="mt-6">
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    Send Recovery Code
                </button>
            </div>
        </form>

        <div class="text-center mt-6" style="border-top: 1px solid var(--color-border); padding-top: var(--space-4);">
            <p class="text-sm text-secondary" style="margin: 0;">
                Remember your password? <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Back to login</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
