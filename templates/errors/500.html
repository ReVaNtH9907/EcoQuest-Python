{% extends "base.html" %}

{% block title %}500 — Server Error · EcoQuest{% endblock %}

{% block content %}
<div class="container text-center" style="padding: var(--space-20) 0;">
    <h1 style="font-size: 5rem; color: var(--color-error); margin-bottom: var(--space-4);">500</h1>
    <h2 style="margin-bottom: var(--space-4);">Something went wrong</h2>
    <p style="max-width: 400px; margin: 0 auto var(--space-8);">
        We're working on fixing the problem. Please try again shortly.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">← Back to Home</a>
</div>
{% endblock %}
